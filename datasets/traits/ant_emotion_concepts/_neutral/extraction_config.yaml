polarity: single
position: "response[50:]"
max_new_tokens: 512
temperature: 0.7
rollouts: 2
methods: ["mean_diff"]

# --replication-level=full override: use the paper-verbatim neutral-dialogue
# template instead of the story template inherited from the category config.
# Resolved against THIS file's parent dir, so ../prompts/neutral_dialogue.txt
# resolves to datasets/traits/ant_emotion_concepts/prompts/neutral_dialogue.txt.
# Full-mode runs should pass --max-new-tokens 2048 (default 512 too short for
# a batched N=12 dialogue response).
batched_story_template_file: ../prompts/neutral_dialogue.txt
