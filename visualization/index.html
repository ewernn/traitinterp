<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trait Interp Visualization</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%231a1a1a'/><path d='M4 22 Q10 8, 16 16 T28 10' stroke='%23a09f6c' stroke-width='3' fill='none' stroke-linecap='round'/><circle cx='28' cy='10' r='2.5' fill='%23a09f6c'/></svg>">

    <!-- External Dependencies -->
    <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/js-yaml/4.1.0/js-yaml.min.js"></script>

    <!-- Overview Tab Dependencies -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>

    <!-- Application Styles -->
    <link rel="stylesheet" href="/visualization/styles.css">
</head>
<body>
    <!-- Preview modal (global) -->
    <div class="preview-modal" id="preview-modal">
        <div class="preview-content">
            <div class="preview-header">
                <h3 id="preview-title" style="margin: 0; color: var(--text-primary);"></h3>
                <button class="close-btn" onclick="document.getElementById('preview-modal').classList.remove('show')">×</button>
            </div>
            <div class="preview-body" id="preview-body"></div>
        </div>
    </div>

    <div class="container">
        <!-- Sidebar Toggle (mobile) -->
        <button class="sidebar-toggle" id="sidebar-toggle" title="Toggle sidebar" aria-label="Toggle navigation">☰</button>

        <!-- Scrim behind the mobile nav drawer -->
        <div class="nav-scrim" id="nav-scrim"></div>

        <!-- Nav Drawer: wraps both nav panels. display:contents on desktop (no layout
             change), an off-canvas drawer on mobile so the analysis panel stays reachable. -->
        <div class="nav-drawer" id="nav-drawer">

        <!-- Main Nav (always visible) -->
        <div class="sidebar sidebar-main" id="sidebar">
            <div class="sidebar-header">
                <div class="sidebar-header-content">
                    <div class="sidebar-title">Trait Interp</div>
                    <div class="sidebar-subtitle">Vector Visualization</div>
                </div>
                <button class="sidebar-collapse-btn" id="sidebar-collapse" title="Collapse sidebar">◀</button>
            </div>

            <!-- Top-level nav: populated by renderNav() in sidebar.js from /api/views -->
            <div class="sidebar-section" id="nav-main-items"></div>

            <div class="sidebar-section" id="nav-analysis-entry-wrap">
                <div class="nav-item" id="analysis-entry">Experiment Dashboard</div>
            </div>
        </div>

        <!-- Analysis Panel (conditional) -->
        <div class="sidebar sidebar-analysis hidden" id="sidebar-analysis">
            <div class="sidebar-section">
                <div class="section-title">Experiment Dashboard</div>
                <!-- Sub-nav: populated by renderNav() in sidebar.js from /api/views -->
                <div id="nav-analysis-items"></div>
            </div>

            <div class="sidebar-section" id="experiment-viz-section" style="display:none;">
                <div class="section-title">Experiment Viz</div>
                <div id="experiment-viz-list"></div>
            </div>

            <div class="sidebar-section" id="experiment-section">
                <div class="section-title">Experiments</div>
                <div id="experiment-list" class="experiment-picker">
                    <div class="experiment-option" style="opacity: 0.5;">Loading...</div>
                </div>
            </div>

            <div class="sidebar-section">
                <div class="section-title">
                    Traits (<span id="selected-count">0</span>)
                </div>
                <button class="select-all-btn" id="select-all-btn">Select All</button>
                <div id="trait-checkboxes"></div>
            </div>
        </div>
        </div><!-- /nav-drawer -->

        <!-- Prompt Set Sidebar: left panel for prompt set selection (inference only) -->
        <div id="prompt-set-sidebar" class="sidebar sidebar-promptsets hidden">
            <!-- Populated by renderPromptSetSidebar() in prompt-set-sidebar.js -->
        </div>

        <!-- Main Content -->
        <div class="main-content">
            <header>
                <div class="page-title" id="page-title">Overview</div>
                <div class="header-right">
                    <div id="gpu-status" class="gpu-status" title="GPU Status">
                        <span class="gpu-icon">
                            <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
                                <path d="M4 6h16v2H4zm0 5h16v2H4zm0 5h16v2H4z"/>
                                <rect x="2" y="4" width="20" height="16" rx="2" stroke="currentColor" stroke-width="1.5" fill="none"/>
                            </svg>
                        </span>
                        <span class="gpu-name">--</span>
                        <span class="gpu-memory"></span>
                    </div>
                    <button id="reset-storage-btn" class="reset-storage-btn" title="Reset localStorage to defaults" style="display: none;" onclick="window.resetLocalStorage()">Reset</button>
                    <a href="/docs/" class="github-link" title="Documentation" style="font-size: 13px; text-decoration: none;">Docs</a>
                    <a href="https://github.com/ewernn/traitinterp" target="_blank" rel="noopener" class="github-link" title="View on GitHub">
                        <svg viewBox="0 0 16 16" width="20" height="20" fill="currentColor">
                            <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/>
                        </svg>
                    </a>
                    <button class="theme-toggle" id="theme-toggle" title="Toggle dark mode">🌙</button>
                </div>
            </header>

            <div class="content-wrapper" id="content-area">
                <div class="loading">Loading experiment data...</div>
            </div>

            <!-- Prompt Picker: fixed at bottom (only for inference views) -->
            <div id="prompt-picker" style="display: none;">
                <!-- Populated by renderPromptPicker() in prompt-picker.js -->
            </div>
        </div>
    </div>

    <!-- Core Utilities (pure functions, no DOM, no deps) -->
    <script type="module" src="/visualization/core/types.js"></script>
    <script type="module" src="/visualization/core/utils.js"></script>
    <script type="module" src="/visualization/core/annotations.js"></script>
    <script type="module" src="/visualization/core/ui.js"></script>
    <script type="module" src="/visualization/core/display.js"></script>
    <script type="module" src="/visualization/core/charts.js"></script>
    <script type="module" src="/visualization/components/chart-renderers.js"></script>
    <script type="module" src="/visualization/core/paths.js"></script>
    <script type="module" src="/visualization/core/citations.js"></script>
    <script type="module" src="/visualization/core/markdown-view.js"></script>
    <script type="module" src="/visualization/core/conversation-tree.js"></script>

    <!-- Expose core primitives for dynamically-loaded experiment viz modules -->
    <script type="module">
        import { buildChartLayout, renderChart, updateChart, createHtmlLegend, buildHeatmapAnnotations, CHART_PRESETS, PLOTLY_CONFIG } from '/visualization/core/charts.js';
        import { renderToggle, renderLoading, renderSubsection, renderSegmentedControl } from '/visualization/core/ui.js';
        import { getCssVar, cssVarToRgba, getPlotlyLayout } from '/visualization/core/display.js';
        window.vizCore = {
            charts: { buildChartLayout, renderChart, updateChart, createHtmlLegend, buildHeatmapAnnotations, CHART_PRESETS, PLOTLY_CONFIG },
            ui: { renderToggle, renderLoading, renderSubsection, renderSegmentedControl },
            display: { getCssVar, cssVarToRgba, getPlotlyLayout }
        };
    </script>

    <!-- State Management -->
    <script type="module" src="/visualization/core/state.js"></script>

    <!-- Components (depend on state + core) -->
    <script type="module" src="/visualization/components/sidebar.js"></script>
    <script type="module" src="/visualization/components/prompt-picker.js"></script>
    <script type="module" src="/visualization/components/prompt-set-sidebar.js"></script>
    <script type="module" src="/visualization/components/custom-blocks/index.js"></script>
    <script type="module" src="/visualization/components/response-browser.js"></script>
    <script type="module" src="/visualization/components/top-spans.js"></script>
    <script type="module" src="/visualization/components/inference-controls.js"></script>
    <script type="module" src="/visualization/components/live-chat-chart.js"></script>

    <!-- View Modules -->
    <script type="module" src="/visualization/views/overview.js"></script>
    <script type="module" src="/visualization/views/findings.js"></script>
    <script type="module" src="/visualization/views/extraction/extraction-data.js"></script>
    <script type="module" src="/visualization/views/extraction/section-best-vectors.js"></script>
    <script type="module" src="/visualization/views/extraction/section-heatmaps.js"></script>
    <script type="module" src="/visualization/views/extraction/section-logit-lens.js"></script>
    <script type="module" src="/visualization/views/extraction/section-vector-geometry.js"></script>
    <script type="module" src="/visualization/views/extraction/extraction-view.js"></script>
    <script type="module" src="/visualization/views/inference/inference-data.js"></script>
    <script type="module" src="/visualization/views/inference/inference-view-controls.js"></script>
    <script type="module" src="/visualization/views/inference/chart-token-trajectory.js"></script>
    <script type="module" src="/visualization/views/inference/chart-trait-token-heatmap.js"></script>
    <script type="module" src="/visualization/views/inference/chart-activation-magnitude.js"></script>
    <script type="module" src="/visualization/views/inference/inference-view.js"></script>
    <script type="module" src="/visualization/views/steering/shared.js"></script>
    <script type="module" src="/visualization/views/steering/filters.js"></script>
    <script type="module" src="/visualization/views/steering/overview.js"></script>
    <script type="module" src="/visualization/views/steering/detail.js"></script>
    <script type="module" src="/visualization/views/steering/steering-view.js"></script>
    <script type="module" src="/visualization/views/model-analysis/model-analysis-data.js"></script>
    <script type="module" src="/visualization/views/model-analysis/section-diagnostics.js"></script>
    <script type="module" src="/visualization/views/model-analysis/section-variant-comparison.js"></script>
    <script type="module" src="/visualization/views/model-analysis/model-analysis-view.js"></script>
    <script type="module" src="/visualization/views/live-chat.js"></script>
    <script type="module" src="/visualization/views/annotation-browser/view.js"></script>
    <script type="module" src="/visualization/views/correlation-matrices/view.js"></script>

    <!-- View Router -->
    <script type="module">
        // Simple view router - calls appropriate render function based on current view
        window.renderView = function() {
            const view = window.state.currentView;

            // Update page title
            const viewTitles = {
                'overview': 'Overview',
                'findings': 'Research Findings',
                'extraction': 'Extraction',
                'steering': 'Steering',
                'inference': 'Inference',
                'model-analysis': 'Model Analysis',
                'live-chat': 'Live Chat',
                'annotation-browser': 'Bias Annotation Browser',
                'correlation-matrices': 'Correlation Matrices',
                'experiment-viz': 'Experiment Viz'
            };
            document.getElementById('page-title').textContent = viewTitles[view] || 'Unknown View';

            switch (view) {
                case 'overview':
                    window.renderOverview();
                    break;
                case 'findings':
                    window.renderFindings();
                    break;
                case 'extraction':
                    window.renderExtraction();
                    break;
                case 'steering':
                    window.renderSteering();
                    break;
                case 'inference':
                    window.renderInference();
                    break;
                case 'model-analysis':
                    window.renderModelAnalysis();
                    break;
                case 'live-chat':
                    window.renderLiveChat();
                    break;
                case 'annotation-browser':
                    window.renderAnnotationBrowser();
                    break;
                case 'correlation-matrices':
                    window.renderCorrelationMatrices();
                    break;
                case 'experiment-viz': {
                    const expName = window.state.currentExpViz;
                    if (!expName) {
                        document.getElementById('content-area').innerHTML = '<div class="error">No experiment visualization selected.</div>';
                        break;
                    }
                    const container = document.getElementById('content-area');
                    container.innerHTML = '<div class="loading">Loading experiment visualization...</div>';
                    import(`/experiments/${expName}/visualization/index.js`)
                        .then(mod => {
                            container.innerHTML = '';
                            document.getElementById('page-title').textContent = mod.title || expName;
                            mod.render(container, {
                                ...window.vizCore,
                                state: window.state,
                                paths: window.paths,
                                expBase: `/experiments/${expName}`
                            });
                        })
                        .catch(err => {
                            container.innerHTML = `<div class="error">Failed to load experiment viz: ${err.message}</div>`;
                            console.error('Experiment viz load failed:', err);
                        });
                    break;
                }
                default:
                    document.getElementById('content-area').innerHTML =
                        '<div class="error">Unknown view: ' + view + '</div>';
            }
        };

        // Initialize application when DOM is ready
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', window.initApp);
        } else {
            window.initApp();
        }

        // Sidebar toggle functionality
        document.addEventListener('DOMContentLoaded', () => {
            const sidebar = document.getElementById('sidebar');
            const analysisPanel = document.getElementById('sidebar-analysis');
            const collapseBtn = document.getElementById('sidebar-collapse');
            const toggleBtn = document.getElementById('sidebar-toggle');
            const drawer = document.getElementById('nav-drawer');
            const scrim = document.getElementById('nav-scrim');

            // Desktop collapse button - collapses all sidebars
            collapseBtn.addEventListener('click', () => {
                const isCollapsing = !sidebar.classList.contains('collapsed');
                sidebar.classList.toggle('collapsed');
                if (analysisPanel) {
                    analysisPanel.classList.toggle('collapsed', isCollapsing);
                }
                // Also hide prompt-set sidebar when collapsing
                if (isCollapsing) {
                    const psSidebar = document.getElementById('prompt-set-sidebar');
                    if (psSidebar) psSidebar.classList.add('hidden');
                } else {
                    // Re-expanding: restore prompt-set sidebar if it was open
                    window.renderPromptSetSidebar?.();
                }
                collapseBtn.textContent = isCollapsing ? '▶' : '◀';
                // Reposition prompt picker after sidebar transition
                const ppContainer = document.getElementById('prompt-picker');
                if (ppContainer && ppContainer.style.display !== 'none' && window.positionPromptPicker) {
                    window.positionPromptPicker(ppContainer);
                }
            });

            // Mobile drawer: single off-canvas panel holding both nav columns.
            const setDrawer = (open) => {
                drawer.classList.toggle('mobile-open', open);
                scrim.classList.toggle('show', open);
            };

            toggleBtn.addEventListener('click', () => {
                setDrawer(!drawer.classList.contains('mobile-open'));
            });

            // Tap the scrim to dismiss.
            scrim.addEventListener('click', () => setDrawer(false));

            // Tapping a view nav item closes the drawer so the content is visible.
            drawer.addEventListener('click', (e) => {
                if (window.innerWidth <= 768 &&
                    e.target.closest('.nav-item[data-view], #analysis-entry')) {
                    setDrawer(false);
                }
            });

            // Returning to desktop width clears the mobile-open state.
            window.addEventListener('resize', () => {
                if (window.innerWidth > 768) setDrawer(false);
            });
        });
    </script>
</body>
</html>
